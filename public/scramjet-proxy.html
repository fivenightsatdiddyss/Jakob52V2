<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jakob-52 · scramjet proxy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #04020a; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
    #toolbar {
      display: flex; gap: 8px; padding: 10px 14px; align-items: center;
      background: rgba(10,5,24,0.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 10;
    }
    .nav-btns { display: flex; gap: 4px; }
    .nav-btns button {
      background: rgba(255,255,255,0.08); border: none; color: #c4b5fd;
      padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px;
      transition: background 0.2s;
    }
    .nav-btns button:hover { background: rgba(255,255,255,0.15); }
    #url-bar {
      flex: 1; display: flex; align-items: center; gap: 8px; padding: 6px 12px;
      border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
    }
    #url-input {
      flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; outline: none;
    }
    #url-input::placeholder { color: rgba(255,255,255,0.3); }
    #go-btn {
      padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer;
      background: linear-gradient(135deg, #c026d3, #7c3aed); color: #fff;
      font-size: 13px; font-weight: 600; transition: transform 0.15s;
    }
    #go-btn:hover { transform: scale(1.05); }
    #go-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #status {
      font-size: 11px; color: rgba(255,255,255,0.4); padding: 0 8px; min-width: 80px; text-align: right;
    }
    #loading-screen {
      position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; background: #04020a;
      transition: opacity 0.3s;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(168,85,247,0.2);
      border-top-color: #c026d3; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-screen p { color: rgba(255,255,255,0.5); font-size: 14px; }
    #back-btn {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px;
      border-radius: 8px; background: rgba(255,255,255,0.08); color: #c4b5fd;
      border: none; cursor: pointer; font-size: 13px; transition: background 0.2s;
      text-decoration: none;
    }
    #back-btn:hover { background: rgba(255,255,255,0.15); }
    #frame-container { position: fixed; top: 53px; left: 0; right: 0; bottom: 0; }
    #frame-container iframe { width: 100%; height: 100%; border: none; }
  </style>
  <script src="/scramjet/scramjet.js"></script>
  <script src="/controller/controller.api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js"></script>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <p id="loading-text">initializing scramjet proxy…</p>
  </div>

  <div id="toolbar" style="display:none;">
    <a href="/" id="back-btn">← back</a>
    <div class="nav-btns">
      <button id="reloadNav" title="Reload">↻</button>
    </div>
    <div id="url-bar">
      <span style="font-size:12px;opacity:0.4;">🔒</span>
      <input id="url-input" type="text" placeholder="search or enter a url…" />
    </div>
    <button id="go-btn">go</button>
    <span id="status">ready</span>
  </div>

  <div id="frame-container">
    <iframe id="browser-frame" title="Scramjet Browser"></iframe>
  </div>

  <script>
    var loadingText = document.getElementById("loading-text");
    var loadingScreen = document.getElementById("loading-screen");
    var toolbar = document.getElementById("toolbar");
    var statusEl = document.getElementById("status");
    var urlInput = document.getElementById("url-input");
    var goBtn = document.getElementById("go-btn");
    var iframe = document.getElementById("browser-frame");

    function setStatus(t, err) {
      statusEl.textContent = t;
      statusEl.style.color = err ? "#ff6b6b" : "rgba(255,255,255,0.4)";
    }

    function norm(u) {
      return u.startsWith("http") ? u : "https://" + u;
    }

    async function init() {
      try {
        loadingText.textContent = "registering service worker…";
        await navigator.serviceWorker.ready;
        var serviceworker = navigator.serviceWorker.controller || (await navigator.serviceWorker.ready).active;

        loadingText.textContent = "connecting to wisp server…";
        var EpoxyTransport = self.EpoxyTransport.default;
        var transport = new EpoxyTransport({
          wisp: "wss://wisp.mercurywork.shop/"
        });
        await transport.init();

        loadingText.textContent = "starting scramjet controller…";
        var Controller = $scramjetController.Controller;
        var defaultConfig = $scramjet.defaultConfig;
        var scramjet = new Controller({
          serviceworker: serviceworker,
          transport: transport,
          scramjetConfig: defaultConfig
        });
        await scramjet.wait();

        loadingText.textContent = "creating browser frame…";
        var frame = scramjet.createFrame(iframe);

        // Navigate to google by default
        frame.go("https://www.google.com");

        setStatus("ready");
        loadingScreen.classList.add("hidden");
        toolbar.style.display = "flex";

        // Wire up the URL bar
        goBtn.onclick = function() {
          var url = norm(urlInput.value);
          urlInput.value = url;
          frame.go(url);
          setStatus("loading…");
        };

        urlInput.addEventListener("keydown", function(e) {
          if (e.key === "Enter") goBtn.onclick();
        });

        document.getElementById("reloadNav").onclick = function() {
          frame.go(urlInput.value);
        };

      } catch (e) {
        console.error(e);
        loadingText.textContent = "Error: " + e.message;
        loadingText.style.color = "#ff6b6b";
      }
    }

    // Register the service worker, then boot
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").then(init).catch(function(e) {
        loadingText.textContent = "Service worker registration failed: " + e.message;
        loadingText.style.color = "#ff6b6b";
      });
    } else {
      loadingText.textContent = "No service worker support";
      loadingText.style.color = "#ff6b6b";
    }
  </script>
</body>
</html>
