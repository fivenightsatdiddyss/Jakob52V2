<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jakob-52 · experimental proxy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #04020a; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
    #navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      display: flex; align-items: center; gap: 8px; padding: 10px 16px;
      background: rgba(10,5,24,0.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    #back-btn {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px;
      border-radius: 8px; background: rgba(255,255,255,0.08); color: #c4b5fd;
      border: none; cursor: pointer; font-size: 13px; transition: background 0.2s;
    }
    #back-btn:hover { background: rgba(255,255,255,0.15); }
    #address-bar {
      flex: 1; display: flex; align-items: center; gap: 8px; padding: 6px 12px;
      border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
    }
    #url-input {
      flex: 1; background: transparent; border: none; color: #fff; font-size: 14px;
      outline: none;
    }
    #url-input::placeholder { color: rgba(255,255,255,0.3); }
    #go-btn {
      padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer;
      background: linear-gradient(135deg, #c026d3, #7c3aed); color: #fff;
      font-size: 13px; font-weight: 600; transition: transform 0.15s;
    }
    #go-btn:hover { transform: scale(1.05); }
    #go-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #status {
      font-size: 11px; color: rgba(255,255,255,0.4); padding: 0 8px;
    }
    #loading-screen {
      position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; background: #04020a;
      transition: opacity 0.3s;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(168,85,247,0.2);
      border-top-color: #c026d3; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-screen p { color: rgba(255,255,255,0.5); font-size: 14px; }
    #frame-container {
      position: fixed; top: 53px; left: 0; right: 0; bottom: 0;
    }
    #frame-container iframe {
      width: 100%; height: 100%; border: none;
    }
    #error-screen {
      position: fixed; inset: 0; z-index: 10001; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; background: #04020a;
      text-align: center; padding: 20px;
    }
    #error-screen h2 { color: #f0abfc; font-size: 20px; }
    #error-screen p { color: rgba(255,255,255,0.5); font-size: 14px; max-width: 400px; }
  </style>
  <script src="/scramjet/scramjet.js"></script>
  <script src="/scramjet/controller.api.js"></script>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>initializing scramjet proxy…</p>
  </div>

  <div id="error-screen">
    <h2>proxy error</h2>
    <p id="error-msg"></p>
    <button id="back-btn" onclick="window.location.href='/'">← back to jakob-52</button>
  </div>

  <div id="navbar" style="display:none;">
    <button id="back-btn" onclick="window.location.href='/'">← back</button>
    <div id="address-bar">
      <span style="font-size:12px;opacity:0.4;">🔒</span>
      <input id="url-input" type="text" placeholder="search or enter a url…" />
    </div>
    <button id="go-btn">go</button>
    <span id="status">ready</span>
  </div>

  <div id="frame-container">
    <iframe id="proxy-frame"></iframe>
  </div>

  <script type="module">
    import { init as initBootstrap } from '/scramjet/bootstrap-client.js';

    const WISP_URL = 'wss://bare-server.fly.dev/wisp/';
    const loadingScreen = document.getElementById('loading-screen');
    const navbar = document.getElementById('navbar');
    const urlInput = document.getElementById('url-input');
    const goBtn = document.getElementById('go-btn');
    const status = document.getElementById('status');
    const frame = document.getElementById('proxy-frame');
    const errorScreen = document.getElementById('error-screen');
    const errorMsg = document.getElementById('error-msg');

    let controller = null;
    let proxyFrame = null;

    async function init() {
      try {
        status.textContent = 'registering service worker…';
        controller = await initBootstrap({
          swPath: '/scramjet/controller.sw.js',
          scramjetBundlePath: '/scramjet/scramjet.js',
          scramjetControllerApiPath: '/scramjet/controller.api.js',
          scramjetUtilsBundlePath: '/scramjet/scramjet-utils.js',
          scramjetWasmPath: '/scramjet/scramjet.wasm',
          scramjetControllerInjectPath: '/scramjet/controller.inject.js',
          wispPath: WISP_URL,
          transport: 'epoxy',
          epoxyClientPath: '', // epoxy is bundled in newer versions
        });

        status.textContent = 'ready';
        loadingScreen.classList.add('hidden');
        navbar.style.display = 'flex';

        // create the proxy frame
        const urlWatcher = new $scramjetUtils.UrlWatcherPlugin((url) => {
          urlInput.value = url;
        });
        const catchEscapedLinks = new $scramjetUtils.CatchEscapedLinksPlugin(
          (url) => new URL(`/?goto=${encodeURIComponent(url.href)}`, location.origin)
        );

        proxyFrame = controller.createFrame(frame, {
          plugins: [urlWatcher, catchEscapedLinks],
        });

        // check for a goto param in the URL
        const params = new URLSearchParams(location.search);
        const goto = params.get('goto');
        if (goto) {
          urlInput.value = goto;
          navigate(goto);
        }
      } catch (err) {
        console.error('scramjet init failed:', err);
        errorMsg.textContent = err.message || 'Failed to initialize the scramjet proxy.';
        errorScreen.style.display = 'flex';
        loadingScreen.classList.add('hidden');
      }
    }

    async function navigate(url) {
      if (!proxyFrame || !controller) {
        status.textContent = 'initializing…';
        await init();
      }
      if (!url) return;
      if (!url.startsWith('http')) {
        url = 'https://' + url;
      }
      status.textContent = 'loading…';
      goBtn.disabled = true;
      try {
        await proxyFrame.go(url);
        status.textContent = 'ready';
      } catch (err) {
        status.textContent = 'error';
        console.error('navigation error:', err);
      } finally {
        goBtn.disabled = false;
      }
    }

    goBtn.addEventListener('click', () => navigate(urlInput.value));
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') navigate(urlInput.value);
    });

    // start init
    init();
  </script>
</body>
</html>
