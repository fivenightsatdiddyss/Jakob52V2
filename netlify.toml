# Netlify config for jakob-52 (Next.js 16)
# Docs: https://docs.netlify.com/integrations/frameworks/next-js/

[build]
  # Netlify auto-detects bun.lock and uses bun. The build is a plain `next build`
  # (NOT `bun run build` — that script has cp commands meant for standalone
  # self-hosting and would fail on Netlify).
  command = "npx next build"
  publish = ".next"

# Next.js 16 requires Node 20+. Pin to 22 (LTS, supported on Netlify).
[build.environment]
  NODE_VERSION = "22"
  NEXTRA_VERSION = ""

# The Next.js plugin is auto-detected, but declaring it makes it explicit and
# ensures SSR + API routes are wired into Netlify's serverless function layer.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long-lived cache headers for static assets (Next.js emits hashed filenames
# under /_next/static/, so they're safe to cache aggressively).
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
